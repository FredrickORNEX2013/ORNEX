<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ORNEX - Watch. Create. Earn.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#000;color:#fff}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#splash h1{color:#FF0000;font-size:54px;letter-spacing:3px}
#splash h1 span{color:#fff}
#splash p{color:#aaa;margin-top:8px}
.bar{width:160px;height:4px;background:#333;border-radius:10px;overflow:hidden;margin-top:20px}
.bar div{height:100%;width:40%;background:#FF0000;animation:load 1s infinite}
@keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
#app{display:none;padding-bottom:72px;min-height:100vh}
/* TOP BAR - ORNEX LOGO + SEARCH + BELL + AVATAR - NO OVERLAP */
.top{position:sticky;top:0;background:#000;z-index:20;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.top b{font-size:22px;color:#FF0000;white-space:nowrap}
.top b span{color:#fff}
.top .right{display:flex;gap:10px;align-items:center}
.top input{background:#1a1a1a;border:none;color:#fff;padding:8px 12px;border-radius:20px;width:115px;outline:none;font-size:13px}
.top .ava{width:32px;height:32px;border-radius:50%;background:#FF0000;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
/* FOR YOU - YOUTUBE SHORTS STYLE - LIKE YOUR PHOTO - FULL SCREEN */
.shorts{position:relative;height:530px;overflow:hidden;background:#111;margin-bottom:2px}
.shorts img{width:100%;height:100%;object-fit:cover;display:block}
.shorts .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 45%)}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;opacity:.85}
.side{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.side .c{width:48px;height:48px;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.side .c.red{background:#FF0000}
.side small{font-size:11px;font-weight:600;text-shadow:0 1px 3px #000}
.side .av{width:48px;height:48px;border-radius:50%;background:#FF0000;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid #fff}
.binfo{position:absolute;left:12px;right:75px;bottom:12px;z-index:5}
.binfo .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.binfo .row img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid #fff}
.binfo .row b{font-size:14px}
.sub{background:#fff;color:#000;border:none;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;margin-left:4px}
.sub.done{background:#FF0000;color:#fff}
.binfo p{font-size:13px;line-height:1.4;text-shadow:0 1px 3px #000}
.music{background:rgba(0,0,0,.5);padding:5px 10px;border-radius:20px;font-size:12px;margin-top:8px;width:fit-content;max-width:100%;white-space:nowrap;overflow:hidden}
/* GENERAL */
.pad{padding:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;background:#222;color:#fff;border:none;border-radius:20px;font-size:13px}
.chip.active{background:#FF0000;color:#fff}
input,select{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:none;background:#222;color:#fff;outline:none}
.bigbtn{width:100%;padding:13px;background:#FF0000;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:15px}
.card{background:#151515;padding:14px;border-radius:12px;margin:10px 0}
.ytcard{margin-bottom:16px}
.ytcard img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.ytcard h3{font-size:14px;margin-top:8px}
.ytcard p{font-size:12px;color:#aaa;margin-top:3px}
.create-opt{display:flex;gap:14px;align-items:center;background:#151515;padding:16px;border-radius:14px;margin:10px 0;cursor:pointer}
.create-opt .ico{width:52px;height:52px;border-radius:50%;background:#FF0000;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.create-opt b{font-size:16px}
.create-opt p{font-size:13px;color:#aaa;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;z-index:30}
nav button{flex:1;padding:8px 0;background:none;border:none;color:#888;font-size:11px}
nav button.active{color:#fff}
nav button i{display:block;font-size:20px;font-style:normal}
.plus{font-size:26px!important;background:#FF0000!important;color:#fff!important;width:44px!important;height:44px!important;border-radius:50%!important;margin:-18px auto 0!important;display:flex!important;align-items:center;justify-content:center}
/* ME TAB - EXACTLY YOUTUBE - WHITE / BLACK / RED - NO CHANNELS */
.yt-me{background:#fff;color:#000;min-height:80vh;padding-bottom:20px}
.yt-top{padding:16px;display:flex;gap:12px;align-items:center}
.yt-av{width:54px;height:54px;border-radius:50%;background:#FF0000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;flex-shrink:0}
.yt-top h2{font-size:18px;color:#000}
.yt-top p{font-size:13px;color:#666;margin-top:2px}
.yt-top small{font-size:12px;color:#666}
.yt-act{display:flex;gap:8px;padding:0 16px 14px}
.yt-act button{flex:1;padding:9px;border-radius:20px;border:1px solid #ddd;background:#fff;font-weight:bold;font-size:13px;color:#000}
.yt-act button.red{background:#FF0000;color:#fff;border-color:#FF0000}
.yt-sec{padding:4px 16px}
.yt-sec h3{font-size:16px;margin:14px 0 8px;color:#000}
.yt-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.yt-row b{font-size:14px;color:#000;font-weight:500}
.yt-row p{font-size:12px;color:#666}
.yt-row .ar{margin-left:auto;color:#999}
.yt-vrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.yt-vrow img{width:130px;height:74px;object-fit:cover;border-radius:8px;background:#eee}
.yt-vrow b{font-size:13px;color:#000;display:block;line-height:1.3}
.yt-vrow p{font-size:11px;color:#666;margin-top:3px}
.yt-chip{display:inline-block;background:#f2f2f2;color:#000;padding:6px 12px;border-radius:16px;font-size:12px;margin-right:6px;margin-bottom:6px}
</style>
</head>
<body>
<div id="splash"><h1>ORNE<span>X</span></h1><p>Watch. Create. Earn.</p><div class="bar"><div></div></div></div>
<div id="app">
<div class="top"><b>ORNE<span>X</span></b><div class="right"><input id="search" placeholder="🔍 Search" oninput="doSearch(this.value)"><span style="font-size:20px">🔔</span><div class="ava" id="topAv" onclick="goMe()">O</div></div></div>
<div id="content"></div>
<nav><button onclick="show('foryou',this)" class="active"><i>🏠</i>For You</button><button onclick="show('explore',this)"><i>🔍</i>Explore</button><button onclick="show('post',this)"><i class="plus">+</i>Post</button><button onclick="show('inbox',this)"><i>💬</i>Inbox</button><button onclick="show('me',this)"><i>👤</i>Me</button></nav>
</div>
<script>
let user=localStorage.getItem('ornex_user')||'';
let myPosts=JSON.parse(localStorage.getItem('ornex_posts')||'[]');
let watchLater=JSON.parse(localStorage.getItem('ornex_later')||'[]');
let likedVids=JSON.parse(localStorage.getItem('ornex_liked')||'[]');
let subs=JSON.parse(localStorage.getItem('ornex_subs')||'[]');
let cat='All';let q='';let meView='main';let inboxTab='Friends';
function demo(){return[
{id:1,title:'This Boy Had to Study Until the CANDLE Went Out... 😱',user:'@Dailysyam1',name:'DailySyam',cat:'Entertainment',img:'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=700&q=80',likes:'3.6K',comments:'14',views:'7.2M',music:'blue • yung kai'},
{id:2,title:'Funniest Comedy in Zimbabwe 😂 You Must Watch',user:'@hararefunny',name:'Harare Funny',cat:'Comedy',img:'https://images.unsplash.com/photo-1527224538127-2104bb71c51b?w=700&q=80',likes:'8.9K',comments:'210',views:'1.2M',music:'Zim Comedy Beat'},
{id:3,title:'Drama: He Left Her For Money - Part 1 | Zim Drama',user:'@zimdrama',name:'Zim Drama',cat:'Drama',img:'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=700&q=80',likes:'12K',comments:'890',views:'2.5M',music:'Drama OST'},
{id:4,title:'Talent Show: Best Dancer in Harare! 🔥🔥',user:'@talentzw',name:'Talent ZW',cat:'Entertainment',img:'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=700&q=80',likes:'20K',comments:'1.1K',views:'4.8M',music:'Amapiano - ZW'},
{id:5,title:'How To Earn Daily On ORNEX - Full Guide 💰',user:'@fredrick',name:'Fredrick',cat:'Entertainment',img:'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=700&q=80',likes:'5.6K',comments:'340',views:'890K',music:'ORNEX Original'},
{id:6,title:'Comedy Skit: When Mama Finds Your Phone 😂',user:'@comedyZw',name:'Comedy ZW',cat:'Comedy',img:'https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=700&q=80',likes:'9.1K',comments:'420',views:'1.8M',music:'Funny Beat'},
{id:7,title:'Welcome to ORNEX - Watch. Create. Earn. 🔥',user:'@ornex',name:'ORNEX',cat:'Entertainment',img:'https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?w=700&q=80',likes:'15K',comments:'980',views:'3.1M',music:'ORNEX Anthem'},
{id:8,title:'Zim Music: New Hit Song 2026 - Must Listen 🎵',user:'@zimmusic',name:'Zim Music',cat:'Entertainment',img:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=700&q=80',likes:'32K',comments:'2K',views:'5.5M',music:'Zim Hit 2026'}
]}
function filtered(){let v=[...myPosts.map(p=>({id:p.id,title:p.title,user:p.user,name:p.user.replace('@',''),cat:p.cat,img:p.img,likes:'0',comments:'0',views:'0',music:'ORNEX Sound'})),...demo()];if(cat!=='All')v=v.filter(x=>x.cat===cat);if(q)v=v.filter(x=>(x.title+x.user+x.name).toLowerCase().includes(q.toLowerCase()));return v}
function shortsCard(v){let isSub=subs.includes(v.user);let isLiked=likedVids.find(x=>x.id==v.id);return `<div class="shorts"><img src="${v.img}" onerror="this.src='https://picsum.photos/600/900?random=${v.id}'"><div class="shade"></div><div class="play">▶️</div><div class="side"><div><div class="av">${v.name.charAt(0)}</div></div><div style="text-align:center"><div class="c ${isLiked?'red':''}" onclick="toggleLike(${v.id},'${v.title.replace(/'/g,'')}','${v.img}','${v.user}',this)">👍</div><small>${v.likes}</small></div><div style="text-align:center"><div class="c" onclick="alert('💬 ${v.comments} comments - Nice video! 🔥')">💬</div><small>${v.comments}</small></div><div style="text-align:center"><div class="c" onclick="addLater(${v.id},'${v.title.replace(/'/g,'')}','${v.img}','${v.user}')">🔖</div><small>Save</small></div><div style="text-align:center"><div class="c" onclick="shareVid()">↗️</div><small>Share</small></div><div style="text-align:center"><div class="c">👁️</div><small>${v.views}</small></div></div><div class="binfo"><div class="row"><img src="${v.img}"><b>${v.user}</b><button class="sub ${isSub?'done':''}" onclick="toggleSub('${v.user}',this)">${isSub?'Subscribed':'Subscribe'}</button></div><p>${v.title}</p><div class="music">🎵 ${v.music}</div></div></div>`}
function toggleLike(id,title,img,u,el){if(likedVids.find(x=>x.id==id)){likedVids=likedVids.filter(x=>x.id!=id);el.classList.remove('red')}else{likedVids.push({id,title,img,user:u});el.classList.add('red')}localStorage.setItem('ornex_liked',JSON.stringify(likedVids))}
function toggleSub(u,el){if(subs.includes(u)){subs=subs.filter(x=>x!==u);el.innerText='Subscribe';el.classList.remove('done')}else{subs.push(u);el.innerText='Subscribed';el.classList.add('done')}localStorage.setItem('ornex_subs',JSON.stringify(subs))}
function addLater(id,title,img,u){if(!watchLater.find(x=>x.id==id)){watchLater.push({id,title,img,user:u});localStorage.setItem('ornex_later',JSON.stringify(watchLater));alert('Saved to Watch Later ✅')}else alert('Already in Watch Later')}
function shareVid(){alert('Shared! Send ORNEX to friends!')}
function show(tab,btn){if(btn){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}let c=document.getElementById('content');
if(tab==='foryou'){c.innerHTML=filtered().map(shortsCard).join('')}
if(tab==='explore'){c.innerHTML=`<div class="pad"><h2>Explore</h2><p style="color:#aaa;font-size:13px">Discover stories</p><input placeholder="🔍 Search videos or creators" oninput="doSearch(this.value)"><div class="chips">${['All','Comedy','Drama','Entertainment'].map(x=>`<button class="chip ${cat===x?'active':''}" onclick="setCat('${x}');show('explore')">${x}</button>`).join('')}</div>${filtered().map(v=>`<div class="ytcard"><img src="${v.img}"><h3>${v.title}</h3><p>${v.user} • ${v.views} views • ${v.cat}</p></div>`).join('')}</div>`}
if(tab==='post'){if(!user)return showLogin();c.innerHTML=`<div class="pad"><h2>Create</h2><div class="create-opt" onclick="openUpload()"><div class="ico">⬆️</div><div><b>Upload</b><p>Choose a video from gallery or files</p></div></div><div class="create-opt" onclick="alert('Record - Use Upload for now, camera coming soon!')"><div class="ico">📷</div><div><b>Record</b><p>Record with camera, add filters & sound</p></div></div><div class="create-opt" onclick="openUpload()"><div class="ico">🖼️</div><div><b>Gallery</b><p>Browse your video collection</p></div></div><div class="card" id="uploadBox" style="display:none"><input id="ptitle" placeholder="Video title - e.g. My Funny Skit"><select id="pcat"><option>Comedy</option><option>Drama</option><option>Entertainment</option></select><input id="pimg" placeholder="Thumbnail link (optional)"><button class="bigbtn" onclick="doPost()">+ Post Video</button></div></div>`}
if(tab==='inbox'){if(!user)return showLogin();c.innerHTML=`<div class="pad"><div style="display:flex;gap:8px;align-items:center"><h2>Inbox</h2><span style="background:#FF0000;padding:3px 8px;border-radius:12px;font-size:11px">12 New</span></div><div class="chips">${['Friends','Activities','Following','Followers','Requests'].map(x=>`<button class="chip ${inboxTab===x?'active':''}" onclick="inboxTab='${x}';show('inbox')">${x}</button>`).join('')}</div><div class="card"><b>🔔 @ornex</b><p style="color:#aaa;font-size:13px;margin-top:4px">Welcome to ORNEX, ${user}! Post your first video!</p></div><div class="card"><b>💰 ORNEX Team</b><p style="color:#aaa;font-size:13px;margin-top:4px">You earned 50 coins! Keep posting.</p></div><div class="card"><b>❤️ @hararefunny</b><p style="color:#aaa;font-size:13px;margin-top:4px">Liked your video!</p></div></div>`}
if(tab==='me'){showMe()}}
function openUpload(){document.getElementById('uploadBox').style.display='block'}
function goMe(){show('me',document.querySelectorAll('nav button')[4])}
function setCat(x){cat=x}
function doSearch(v){q=v;show('foryou')}
function showLogin(){let c=document.getElementById('content');c.innerHTML=`<div class="pad" style="text-align:center;padding-top:40px"><h1 style="color:#FF0000;font-size:40px">ORNEX</h1><p style="color:#aaa">Watch. Create. Earn.</p><div style="text-align:left;margin-top:20px"><input id="name" placeholder="Your Name"><button class="bigbtn" onclick="login()">Log In / Sign Up</button></div></div>`}
function login(){let n=document.getElementById('name').value.trim();if(!n){alert('Enter name Boss!');return}user=n;localStorage.setItem('ornex_user',n);document.getElementById('topAv').innerText=n.charAt(0).toUpperCase();goMe()}
function logout(){localStorage.removeItem('ornex_user');user='';document.getElementById('topAv').innerText='O';showLogin()}
function doPost(){let t=document.getElementById('ptitle').value.trim();if(!t){alert('Enter title!');return}myPosts.unshift({id:Date.now(),title:t,user:'@'+user.toLowerCase().replace(/\s/g,''),cat:document.getElementById('pcat').value,img:document.getElementById('pimg').value||'https://picsum.photos/600/900?random='+Math.floor(Math.random()*999)});localStorage.setItem('ornex_posts',JSON.stringify(myPosts));alert('Posted! 🎉');show('foryou',document.querySelectorAll('nav button')[0])}
function listRows(arr){return arr.length?arr.map(v=>`<div class="yt-vrow"><img src="${v.img}"><div><b>${v.title}</b><p>${v.user}</p></div></div>`).join(''):'<p style="color:#666;font-size:13px;padding:10px 0">Nothing here yet.</p>'}
function showMe(){let c=document.getElementById('content');if(!user)return showLogin();let ini=user.charAt(0).toUpperCase();let handle='@'+user.toLowerCase().replace(/\s/g,'');
if(meView==='later'){c.innerHTML=`<div class="yt-me"><div class="yt-top"><button onclick="meView='main';showMe()" style="border:none;background:none;font-size:22px">←</button><h2>Watch Later</h2></div><div class="yt-sec">${listRows(watchLater)}</div></div>`;return}
if(meView==='liked'){c.innerHTML=`<div class="yt-me"><div class="yt-top"><button onclick="meView='main';showMe()" style="border:none;background:none;font-size:22px">←</button><h2>Liked Videos</h2></div><div class="yt-sec">${listRows(likedVids)}</div></div>`;return}
if(meView==='history'){c.innerHTML=`<div class="yt-me"><div class="yt-top"><button onclick="meView='main';showMe()" style="border:none;background:none;font-size:22px">←</button><h2>History</h2></div><div class="yt-sec">${listRows(likedVids)}</div></div>`;return}
if(meView==='settings'){c.innerHTML=`<div class="yt-me"><div class="yt-top"><button onclick="meView='main';showMe()" style="border:none;background:none;font-size:22px">←</button><h2>Settings</h2></div><div class="yt-sec"><div class="yt-row"><b>👤 Account - Manage your ORNEX account</b><span class="ar">›</span></div><div class="yt-row"><b>🔔 Notifications - Push, email, likes, follows</b><span class="ar">›</span></div><div class="yt-row"><b>▶️ Playback - Autoplay, quality, captions</b><span class="ar">›</span></div><div class="yt-row"><b>⬇️ Downloads - Quality, storage, offline</b><span class="ar">›</span></div><div class="yt-row"><b>🔒 Privacy - Who can see your activity</b><span class="ar">›</span></div><div class="yt-row"><b>💰 Earnings - Coins, payouts, monetization</b><span class="ar">›</span></div><div class="yt-row"><b>🌙 Appearance - Red, White, Black theme</b><span class="ar">›</span></div><div class="yt-row"><b>❓ Help & Feedback - Help centre</b><span class="ar">›</span></div><div class="yt-row"><b>ℹ️ About ORNEX - Version 1.0, Made in Zimbabwe</b><span class="ar">›</span></div></div></div>`;return}
c.innerHTML=`<div class="yt-me"><div class="yt-top"><div class="yt-av">${ini}</div><div><h2>${user}</h2><p>${handle} • View profile ›</p><small>${subs.length} subscriptions • ${myPosts.length} videos • Harare, ZW</small></div></div><div class="yt-act"><button class="red" onclick="show('post')">+ Create</button><button onclick="meView='settings';showMe()">⚙️ Settings</button><button onclick="logout()">Switch Account</button></div><div class="yt-sec"><div class="yt-row" onclick="meView='history';showMe()"><b>🕐 History - Videos you watched</b><span class="ar">›</span></div><div class="yt-row" onclick="meView='later';showMe()"><b>⏰ Watch Later - ${watchLater.length} videos saved</b><span class="ar">›</span></div><div class="yt-row" onclick="meView='liked';showMe()"><b>👍 Liked Videos - ${likedVids.length} videos</b><span class="ar">›</span></div><div class="yt-row"><b>📋 Playlists - Create & manage playlists</b><span class="ar">›</span></div><div class="yt-row"><b>🎬 Your Videos - ${myPosts.length} videos posted</b><span class="ar">›</span></div><div class="yt-row"><b>⬇️ Downloads - Videos for offline</b><span class="ar">›</span></div><div class="yt-row"><b>✂️ Your Clips - Clips you created</b><span class="ar">›</span></div><h3>Your Videos</h3>${myPosts.length?myPosts.map(v=>`<div class="yt-vrow"><img src="${v.img}"><div><b>${v.title}</b><p>${v.user} • ${v.cat}</p></div></div>`).join(''):'<p style="color:#666;font-size:13px">No videos yet. Press + Create!</p>'}<h3>More from ORNEX</h3><div class="yt-row" onclick="meView='settings';showMe()
