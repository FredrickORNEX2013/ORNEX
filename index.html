<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ORNEX - Watch. Create. Earn." />
    <meta name="color-scheme" content="dark" />
    <meta " content="yes" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/jpeg" href="./icon.jpg" />
    <link rel="apple-touch-icon" href="./icon.jpg" />
    <title>ORNEX - Watch. Create. Earn.</title>
    <style>
      #splash { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
      #splash h1 { color:#D61E2B; font-size:48px; font-family:Arial, sans-serif; margin:0; letter-spacing:4px; }
      #splash p { color:#fff; font-family:Arial, sans-serif; margin:10px 0 20px 0; }
      #splash .bar { width:140px; height:4px; background:#333; overflow:hidden; border-radius:99px; }
      #splash .bar div { height:100%; width:40%; background:#D61E2B; animation:load 1s infinite; }
      @keyframes load { 0%{margin-left:-40%} 100%{margin-left:100%} }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>ORNEX</h1>
      <p>Watch. Create. Earn.</p>
      <div class="bar"><div></div></div>
    </div>
    <div id="root"></div>
    <script>
      setTimeout(function(){ var s=document.getElementById('splash'); if(s) s.style.display='none'; }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
