<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ORNEX - Watch. Create. Earn." />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <title>ORNEX - Watch. Create. Earn.</title>
    <style>
      #splash { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
      #splash h1 { color:#CC0000; font-size:70px; margin:0; font-family:Arial,sans-serif; letter-spacing:4px; }
      #splash p { color:#fff; font-family:Arial,sans-serif; font-size:18px; margin-top:10px; }
      #splash .bar { width:140px; height:4px; background:#333; margin-top:25px; overflow:hidden; border-radius:99px; }
      #splash .bar div { height:100%; width:50%; background:#CC0000; animation: load 1.5s infinite; }
      @keyframes load { 0%{margin-left:-50%} 100%{margin-left:100%} }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>ORNEX</h1>
      <p>Watch. Create. Earn.</p>
      <div class="bar"><div></div></div>
    </div>
    <div id="root"></div>
    <script>
      setTimeout(function(){ var s=document.getElementById('splash'); if(s) s.style.display='none'; }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
