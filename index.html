<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ORNEX - Watch. Create. Earn.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99}
#splash h1{color:#D61E2B;font-size:48px;letter-spacing:3px}
#splash h1 span{color:#fff}
#splash p{margin:10px 0 20px}
.bar{width:150px;height:4px;background:#333;border-radius:10px;overflow:hidden}
.bar div{height:100%;width:40%;background:#D61E2B;animation:load 1s infinite}
@keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
#app{display:none;min-height:100vh;padding-bottom:80px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:0;background:#000;z-index:10}
header b{font-size:22px;color:#D61E2B}
header b span{color:#fff}
header input{background:#222;border:none;color:#fff;padding:8px 12px;border-radius:20px;width:130px}
#content{padding:10px 12px}
.pill{display:inline-block;padding:7px 14px;background:#222;border-radius:20px;font-size:13px;margin:4px 4px 8px 0;border:none;color:#fff}
.pill.active{background:#D61E2B}
.video{background:#111;border-radius:14px;margin-bottom:14px;overflow:hidden}
.video img{width:100%;height:240px;object-fit:cover;display:block}
.video .info{padding:11px}
.video h3{font-size:15px;line-height:1.3}
.video p{font-size:12px;color:#aaa;margin-top:4px}
.btns{display:flex;gap:7px;margin-top:9px}
.btns button{flex:1;padding:9px;border:none;border-radius:20px;background:#222;color:#fff;font-size:13px}
.btns button.liked{background:#D61E2B}
.card{background:#111;padding:14px;border-radius:12px;margin-bottom:10px}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:none;background:#222;color:#fff}
.bigbtn{width:100%;padding:13px;background:#D61E2B;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;z-index:20}
nav button{flex:1;padding:9px 0 8px;background:none;border:none;color:#888;font-size:11px}
nav button.active{color:#fff}
nav button i{display:block;font-size:19px;font-style:normal}
.plus{font-size:26px!important;background:#D61E2B;color:#fff!important;width:44px;height:44px;border-radius:50%!important;margin:-18px auto 0;display:flex!important;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="splash"><h1>ORNE<span>X</span></h1><p>Watch. Create. Earn.</p><div class="bar"><div></div></div></div>
<div id="app">
<header><b>ORNE<span>X</span></b><input id="search" placeholder="🔍 Search" oninput="doSearch(this.value)"/></header>
<div id="content"></div>
<nav>
<button onclick="show('foryou',this)" class="active"><i>🏠</i>For You</button>
<button onclick="show('explore',this)"><i>🔍</i>Explore</button>
<button onclick="show('post',this)"><i class="plus">+</i>Post</button>
<button onclick="show('inbox',this)"><i>💬</i>Inbox</button>
<button onclick="show('me',this)"><i>👤</i>Me</button>
</nav>
</div>
<script>
let user=localStorage.getItem('ornex_user')||'';
let myPosts=JSON.parse(localStorage.getItem('ornex_posts')||'[]');
let cat='All';
let q='';
function allVids(){
let base=[
{id:1,title:'Welcome to ORNEX - Watch. Create. Earn. 🔥',user:'@ornex',cat:'Entertainment',img:'https://picsum.photos/600/400?random=11',likes:1240,views:'12K'},
{id:2,title:'Funniest Comedy in Zimbabwe 😂 You Must Watch',user:'@hararefunny',cat:'Comedy',img:'https://picsum.photos/600/400?random=12',likes:890,views:'8K'},
{id:3,title:'Drama: He Left Her For Money - Part 1',user:'@zimdrama',cat:'Drama',img:'https://picsum.photos/600/400?random=13',likes:2100,views:'25K'},
{id:4,title:'How To Earn Daily On ORNEX - Full Guide',user:'@fredrick',cat:'Entertainment',img:'https://picsum.photos/600/400?random=14',likes:560,views:'5K'},
{id:5,title:'Talent Show: Best Dancer in Harare!',user:'@talentzw',cat:'Entertainment',img:'https://picsum.photos/600/400?random=15',likes:3200,views:'40K'},
{id:6,title:'Comedy Skit: When Mama Finds Your Phone',user:'@comedyZw',cat:'Comedy',img:'https://picsum.photos/600/400?random=16',likes:1500,views:'18K'}
];
return [...myPosts,...base];
}
function filtered(){
let v=allVids();
if(cat!=='All') v=v.filter(x=>x.cat===cat);
if(q) v=v.filter(x=>(x.title+x.user).toLowerCase().includes(q.toLowerCase()));
return v;
}
function card(v){return `<div class="video"><img src="${v.img}"><div class="info"><h3>${v.title}</h3><p>${v.user} • ${v.views} views • ${v.likes} likes • ${v.cat}</p><div class="btns"><button onclick="like(this)">❤️ Like</button><button onclick="alert('Great comment! Comment feature coming in app update')">💬 Comment</button><button onclick="alert('Followed ${v.user} ✅')">➕ Follow</button><button onclick="shareVid('${v.title}')">↗ Share</button></div></div></div>`}
function shareVid(t){if(navigator.share){navigator.share({title:'ORNEX',text:t,url:location.href})}else{alert('Link copied! Share ORNEX: '+location.href)}}
function like(b){b.classList.toggle('liked');b.textContent=b.classList.contains('liked')?'❤️ Liked':'❤️ Like'}
function show(tab,btn){
if(btn){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
let c=document.getElementById('content');
if(tab==='foryou'){
c.innerHTML='<h2 style="margin:6px 0 10px">For You 🔥</h2>'+(filtered().length?filtered().map(card).join(''):'<div class="card">No videos found. Post first!</div>');
}
if(tab==='explore'){
c.innerHTML='<h2>Explore</h2><div style="margin:8px 0"><input placeholder="🔍 Search videos, creators, categories" oninput="doSearch(this.value)"/></div>'+['All','Comedy','Drama','Entertainment'].map(x=>`<button class="pill ${cat===x?'active':''}" onclick="setCat('${x}')">${x}</button>`).join('')+'<div style="margin-top:6px"><button class="pill active">All Channels</button></div>'+filtered().map(card).join('');
}
if(tab==='post'){
if(!user){return showLogin()}
c.innerHTML='<h2>Post a Video</h2><div class="card"><input id="ptitle" placeholder="Video title - e.g. My Funny Skit"/><select id="pcat"><option>Comedy</option><option>Drama</option><option>Entertainment</option></select><input id="pimg" placeholder="Image link (optional) - leave empty for auto image"/><button class="bigbtn" onclick="doPost()">+ Post Video</button><p style="font-size:12px;color:#aaa;margin-top:8px">Your video will appear instantly in For You & Explore!</p></div>';
}
if(tab==='inbox'){
if(!user){return showLogin()}
c.innerHTML='<h2>Inbox</h2><div><button class="pill active">Friends</button><button class="pill">Activities</button><button class="pill">Following</button><button class="pill">Followers</button></div><div class="card"><b>🔔 @ornex</b><p>Welcome to ORNEX, '+user+'! Post your first video 🎉</p></div><div class="card"><b>🔔 @fredrick</b><p>Your video got 100 views! Keep posting.</p></div><div class="card"><b>💰 ORNEX Team</b><p>You earned 50 coins! Post daily to earn more.</p></div>';
}
if(tab==='me'){
if(!user){return showLogin()}
c.innerHTML='<h2>Me</h2><div class="card" style="text-align:center"><div style="font-size:55px">👤</div><h3>'+user+'</h3><p>@'+user.toLowerCase().replace(/\s/g,'')+' • Harare, ZW</p><p style="margin-top:8px">0 Followers • 0 Following • '+(myPosts.length+2)+' Videos</p><button class="bigbtn" onclick="logout()">Log Out</button></div><h3 style="margin:10px 0">My Videos</h3>'+(myPosts.length?myPosts.map(card).join(''):'<div class="card">No videos yet. Press + Post to add one!</div>');
}
}
function setCat(x){cat=x;show('explore')}
function doSearch(v){q=v;let active=document.querySelector('nav button.active');if(!active||active.textContent.includes('For You')) show('foryou');else show('explore')}
function showLogin(){
let c=document.getElementById('content');
c.innerHTML='<div style="padding:10px;text-align:center;margin-top:20px"><h1 style="color:#D61E2B;font-size:36px">ORNEX</h1><p style="margin:8px 0 18px">Watch. Create. Earn.</p><div style="text-align:left"><p style="font-size:13px">Your Name</p><input id="name" placeholder="e.g. Fredrick"/><p style="font-size:13px;margin-top:6px">Email (optional)</p><input placeholder="you@example.com"/><button class="bigbtn" onclick="login()">Log In / Sign Up</button><p style="font-size:12px;color:#888;margin-top:10px">Free • No password needed • Saved on your phone</p></div></div>';
}
function login(){let n=document.getElementById('name').value.trim();if(!n){alert('Enter your name Boss!');return}user=n;localStorage.setItem('ornex_user',n);show('foryou',document.querySelectorAll('nav button')[0])}
function logout(){localStorage.removeItem('ornex_user');user='';showLogin()}
function doPost(){let t=document.getElementById('ptitle').value.trim();if(!t){alert('Enter video title!');return}let img=document.getElementById('pimg').value||('https://picsum.photos/600/400?random='+Math.floor(Math.random()*1000));myPosts.unshift({id:Date.now(),title:t,user:'@'+user.toLowerCase().replace(/\s/g,''),cat:document.getElementById('pcat').value,img:img,likes:0,views:'0'});localStorage.setItem('ornex_posts',JSON.stringify(myPosts));alert('Posted! 🎉 Your video is live!');show('foryou',document.querySelectorAll('nav button')[0])}
setTimeout(()=>{document.getElementById('splash').style.display='none';document.getElementById('app').style.display='block';if(user){show('foryou')}else{showLogin()}},1500);
</script>
</body>
  </html>
