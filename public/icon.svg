<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ORNEX</title>
  <desc id="desc">A luminous purple glass orb with bold white ORNEX lettering on black.</desc>
  <defs>
    <radialGradient id="orb" cx="35%" cy="25%" r="78%">
      <stop offset="0" stop-color="#9c5aff"/>
      <stop offset=".28" stop-color="#5e21ad"/>
      <stop offset=".63" stop-color="#210b3c"/>
      <stop offset=".88" stop-color="#08050e"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="rim" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#f0d9ff"/>
      <stop offset=".22" stop-color="#c27aff"/>
      <stop offset=".58" stop-color="#7624ff"/>
      <stop offset="1" stop-color="#a24cff"/>
    </linearGradient>
    <radialGradient id="shine" cx="25%" cy="12%" r="78%">
      <stop stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".22" stop-color="#d6aaff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="17" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values=".8 0 0 0 .25  0 .25 0 0 0  0 0 1 0 .8  0 0 0 .85 0" result="purpleGlow"/>
      <feMerge><feMergeNode in="purpleGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="orbClip"><circle cx="256" cy="256" r="202"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <circle cx="256" cy="256" r="207" fill="#8b2cff" opacity=".55" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="202" fill="url(#orb)" stroke="url(#rim)" stroke-width="5"/>
  <g clip-path="url(#orbClip)">
    <ellipse cx="198" cy="146" rx="147" ry="88" fill="url(#shine)" transform="rotate(-22 198 146)"/>
    <path d="M91 240C111 116 220 54 333 76" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="256" cy="375" rx="145" ry="63" fill="#08020f" opacity=".44"/>
  </g>
  <text x="256" y="278" text-anchor="middle" dominant-baseline="middle" fill="#fff" stroke="#fff" stroke-opacity=".3" stroke-width="1" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="800" letter-spacing="3" filter="url(#textGlow)">ORNEX</text>
</svg>
